name: render_api
description: >-
  Unofficial Dart client for the whole Render REST API: services, Postgres,
  cron jobs, disks, env groups, metrics and more. 208 typed operations.
version: 0.1.4

repository: https://github.com/timmaffett/render_api_sdk
issue_tracker: https://github.com/timmaffett/render_api_sdk/issues
topics:
  - render
  - rest
  - api-client
  - workflows

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
