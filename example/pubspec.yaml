name: render_dashboard
description: >-
  A read-only Flutter dashboard for a Render account, built on package:render_api.
  The example for that package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The package this example exists to demonstrate. A path dependency, so the
  # app always exercises the checkout it sits in rather than a published
  # version that may be older.
  render_api:
    path: ../

  # Four design systems, switchable at runtime. auris and forui are Material
  # themes; fluent_ui and shadcn_flutter replace MaterialApp outright, which is
  # the whole point of the experiment.
  auris: ^0.2.0
  forui: ^0.25.0
  fluent_ui: ^4.16.0
  shadcn_flutter: ^0.0.53

  # The API token, in the keychain rather than in a preferences file.
  flutter_secure_storage: ^11.0.0

  # Theme settings, which are not secret.
  shared_preferences: ^2.5.5

  # The metrics pages: axes, tooltips and stacked bars.
  fl_chart: ^1.2.0

  # The response cache is an http.Client decorator, so this is a real
  # dependency rather than a test-only one.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
